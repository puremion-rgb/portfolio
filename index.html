<title>이지윤 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
/>
<style>
  /* Layout: 넓은 여백의 한 칼럼(index) 위에, portfolio2의 오로라 · 그라데이션 · 움직이는 목업을 절제해서 얹은 버전 */
  :root {
    --bg: #fafaf9;
    --panel: #f0f0ee;
    --card: #ffffff;
    --ink: #111113;
    --muted: #6b6b73;
    --line: #e3e3e0;
    --accent: #2d5bff;
    /* 포인트 4색 (프로젝트별 색) */
    --c1: #f0506e;
    --c2: #f59e0b;
    --c3: #8b5cf6;
    --c4: #14b8a6;
    --grad: linear-gradient(100deg, var(--c1), var(--c2) 30%, var(--c4) 62%, var(--c3));
    --aurora: 0.3;
    --font-sans: "Geist", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, Menlo, monospace;
    --gutter: clamp(16px, 5vw, 64px);
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d12;
      --panel: #17171d;
      --card: #1b1b22;
      --ink: #ededee;
      --muted: #9a9aa3;
      --line: #26262d;
      --accent: #7b98ff;
      --c1: #ff6b7a;
      --c2: #ffb547;
      --c3: #b38cff;
      --c4: #3fe0c5;
      --aurora: 0.2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0d12;
    --panel: #17171d;
    --card: #1b1b22;
    --ink: #ededee;
    --muted: #9a9aa3;
    --line: #26262d;
    --accent: #7b98ff;
    --c1: #ff6b7a;
    --c2: #ffb547;
    --c3: #b38cff;
    --c4: #3fe0c5;
    --aurora: 0.2;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.65;
    letter-spacing: -0.005em;
    padding-inline: var(--gutter);
    word-break: keep-all;
    overflow-wrap: break-word;
    overflow-x: clip;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  ::selection { background: var(--c3); color: #fff; }
  .page { max-width: 1120px; margin: 0 auto; }
  .mono {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .grad-text {
    background: var(--grad);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: flow 9s linear infinite;
  }
  @keyframes flow { to { background-position: -250% 0; } }

  /* 스크롤 진행 바 */
  .progress {
    position: fixed; top: 0; left: 0; z-index: 50;
    width: 100%; height: 3px;
    background: var(--grad);
    transform-origin: 0 50%;
    transform: scaleX(0);
  }

  /* 상단 */
  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    margin-inline: calc(var(--gutter) * -1);
    padding-inline: var(--gutter);
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }
  header.line { border-color: var(--line); }
  header .page { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; }
  .brand { font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
  .brand i { width: 10px; height: 10px; border-radius: 3px; background: var(--grad); background-size: 250% 100%; animation: flow 6s linear infinite; }
  .brand span { color: var(--muted); font-weight: 400; }
  header nav { display: flex; gap: 4px; font-size: 14px; }
  header nav a { color: var(--muted); padding: 6px 12px; border-radius: 999px; transition: color 0.15s, background 0.15s; }
  header nav a:hover, header nav a.on { color: var(--ink); background: color-mix(in srgb, var(--ink) 6%, transparent); }

  /* 히어로 */
  .hero { position: relative; isolation: isolate; padding-block: clamp(72px, 12vw, 140px) clamp(56px, 8vw, 96px); }
  .aurora {
    position: absolute; z-index: -1; pointer-events: none; overflow: hidden;
    inset: -64px calc(var(--gutter) * -1) 0;
    -webkit-mask-image: linear-gradient(#000 50%, transparent);
    mask-image: linear-gradient(#000 50%, transparent);
  }
  .aurora i {
    position: absolute; border-radius: 50%;
    filter: blur(80px); opacity: var(--aurora);
    animation: drift 16s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(1) { width: min(46vw, 560px); aspect-ratio: 1; background: var(--c1); top: -12%; left: -6%; }
  .aurora i:nth-child(2) { width: min(40vw, 480px); aspect-ratio: 1; background: var(--c3); top: -4%; right: -4%; animation-duration: 20s; animation-delay: -6s; }
  .aurora i:nth-child(3) { width: min(34vw, 420px); aspect-ratio: 1; background: var(--c4); top: 30%; left: 34%; animation-duration: 23s; animation-delay: -12s; }
  .aurora i:nth-child(4) { width: min(26vw, 320px); aspect-ratio: 1; background: var(--c2); top: 40%; left: 4%; animation-duration: 18s; animation-delay: -3s; }
  @keyframes drift { to { transform: translate(7vw, 5vh) scale(1.18); } }

  .hello { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); margin: 0 0 28px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22a06b; animation: ping 2s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(34,160,107,.55); } 100% { box-shadow: 0 0 0 10px rgba(34,160,107,0); } }
  .hero h1 {
    font-weight: 600;
    font-size: clamp(32px, 5.4vw, 60px);
    line-height: 1.22;
    letter-spacing: -0.035em;
    margin: 0;
    max-width: 16em;
    text-wrap: balance;
  }
  .hero h1 .soft { color: var(--muted); }
  .typer { margin: 22px 0 0; font-size: clamp(17px, 2vw, 21px); font-weight: 500; min-height: 1.6em; color: var(--muted); }
  .typer b { color: var(--ink); font-weight: 600; }
  .caret { display: inline-block; width: 2px; height: 1em; background: var(--c1); vertical-align: -0.12em; margin-left: 3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 48px; align-items: center; }

  .avatar { position: relative; width: clamp(150px, 20vw, 220px); aspect-ratio: 1; max-width: 100%; }
  .avatar::before {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c4), var(--c3), var(--c1));
    animation: spin 14s linear infinite;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  }
  .avatar svg { position: relative; width: 100%; height: 100%; display: block; animation: bob 6s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 50% { translate: 0 -6px; } }

  .hero-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 500;
    padding: 10px 18px; border-radius: 999px;
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 60%, transparent);
    backdrop-filter: blur(8px);
    transition: border-color 0.15s, background 0.15s, transform 0.25s var(--ease);
  }
  .pill-btn:hover { border-color: var(--ink); }
  .pill-btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); position: relative; }
  .pill-btn.solid::after {
    content: ""; position: absolute; inset: -1px; z-index: -1; border-radius: inherit;
    background: var(--grad); background-size: 250% 100%; animation: flow 6s linear infinite;
    filter: blur(14px); opacity: 0.45;
  }
  .pill-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .hero-meta { display: flex; flex-wrap: wrap; gap: 12px 40px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line); }
  .hero-meta div { display: flex; flex-direction: column; gap: 4px; }
  .hero-meta b { font-weight: 500; font-size: 15px; }

  /* 섹션 머리 */
  .sec { padding-block: 88px 72px; border-top: 1px solid var(--line); }
  .sec.no-line { border-top: 0; }
  .sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 48px; }
  .sec-head .tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .sec-head .tag::before { content: ""; width: 18px; height: 2px; border-radius: 2px; background: var(--grad); }
  .sec-head h2 { margin: 10px 0 0; font-size: clamp(28px, 4vw, 44px); font-weight: 600; letter-spacing: -0.04em; line-height: 1.1; }

  /* 프로젝트 */
  .works { display: flex; flex-direction: column; gap: 112px; }
  .work { --hue: var(--c3); display: flex; flex-direction: column; gap: 28px; }
  .visual {
    --tint: #e9ecff;
    display: block; position: relative; isolation: isolate;
    border-radius: 24px; overflow: hidden;
    background: var(--tint);
    aspect-ratio: 16 / 8.5; max-width: 100%;
    transform: perspective(1400px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform 0.5s var(--ease), box-shadow 0.4s;
  }
  .visual:hover { box-shadow: 0 30px 70px -40px color-mix(in srgb, var(--hue) 70%, transparent); }
  .visual::before {
    content: ""; position: absolute; z-index: -1; width: 60%; aspect-ratio: 1; border-radius: 50%;
    background: var(--hue); filter: blur(90px); opacity: 0.28; top: -30%; right: -12%;
    transition: opacity 0.4s;
  }
  .visual:hover::before { opacity: 0.45; }
  .glare {
    position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; transition: opacity 0.3s;
    background: radial-gradient(420px circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,.28), transparent 60%);
  }
  .visual:hover .glare { opacity: 1; }
  .visual .frame {
    position: absolute; left: 50%; top: 14%;
    width: min(78%, 760px); height: 100%;
    transform: translateX(-50%);
    transition: transform 0.5s var(--ease);
    background: #fff; border-radius: 12px 12px 0 0;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 24px 60px -24px rgba(20,20,40,.35);
    overflow: hidden; color: #1a1a1f;
  }
  .visual:hover .frame { transform: translateX(-50%) translateY(-10px); }
  .visual .frame img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .chrome { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-bottom: 1px solid #ececec; }
  .chrome i { width: 9px; height: 9px; border-radius: 50%; background: #e2e2e2; }
  .chrome i:nth-child(1) { background: #ff6b7a; } .chrome i:nth-child(2) { background: #ffb547; } .chrome i:nth-child(3) { background: #3fe0c5; }
  .chrome u { text-decoration: none; margin-left: 12px; font: 11px/20px var(--font-mono); color: #8a8a92; background: #f4f4f5; border-radius: 6px; padding: 0 10px; white-space: nowrap; overflow: hidden; }
  .ui { padding: 3.2% 3.4%; height: calc(100% - 34px); font-size: clamp(8px, 1.1vw, 12px); line-height: 1.45; }

  .visual .award {
    position: absolute; top: 18px; left: 18px; z-index: 2;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 13px; border-radius: 999px;
    color: #3b2800; font-size: 12px; font-weight: 700;
    background: linear-gradient(110deg, #ffd66b, #fff2c2 40%, #ffc23d 60%, #ffe39a);
    background-size: 250% 100%; animation: flow 3.5s linear infinite;
    box-shadow: 0 0 22px rgba(255, 200, 80, 0.45);
  }
  .float {
    position: absolute; z-index: 2;
    padding: 8px 13px; border-radius: 12px;
    font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--ink);
    background: color-mix(in srgb, var(--card) 88%, transparent);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    box-shadow: 0 14px 30px -14px rgba(0,0,0,.35);
    animation: bob 5s ease-in-out infinite;
  }
  .float em { font-style: normal; color: var(--hue); }
  .float.a { top: 9%; right: 4%; }
  .float.b { bottom: 9%; left: 4%; animation-delay: -2.5s; }


  /* 실제 화면 배치 (shots) */
  .shots { position: absolute; inset: 0; }
  .shots .desk {
    position: absolute; left: 3.5%; top: 17%; width: 50%;
    border-radius: 10px; overflow: hidden; background: #fff;
    box-shadow: 0 30px 60px -28px rgba(20,20,50,.45);
    transition: transform .6s var(--ease);
  }
  .shots .desk .chrome { height: 26px; padding: 0 10px; }
  .shots .desk .chrome i { width: 7px; height: 7px; }
  .shots .desk .chrome u { font-size: 10px; line-height: 16px; margin-left: 8px; }
  .shots .desk img { display: block; width: 100%; }
  .phone {
    position: absolute; aspect-ratio: 0.5; height: 76%; top: 12%;
    padding: 5px; border-radius: 26px; background: #10131f;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 30px 50px -22px rgba(10,12,40,.55);
    transition: transform .6s var(--ease);
  }
  .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 21px; background: #f4f6fb; }
  .phone.p1 { left: 48%; transform: rotate(-3deg); }
  .phone.p2 { left: 60%; height: 88%; top: 6%; z-index: 2; border-radius: 30px; }
  .phone.p2 img { border-radius: 25px; }
  .phone.p3 { left: 76.5%; transform: rotate(3deg); }
  .no-desk .phone.p1 { left: 22%; } .no-desk .phone.p2 { left: 38.5%; } .no-desk .phone.p3 { left: 57.5%; }
  .visual:hover .phone.p1 { transform: rotate(-6deg) translate(-10px, 4px); }
  .visual:hover .phone.p2 { transform: translateY(-10px); }
  .visual:hover .phone.p3 { transform: rotate(6deg) translate(10px, 4px); }
  .visual:hover .shots .desk { transform: translate(-8px, -6px); }
  .has-shots .phone, .has-shots .desk { animation: shotIn .9s var(--ease) both paused; }
  .has-shots.in .phone, .has-shots.in .desk { animation-play-state: running; }
  .phone.p1 { animation-delay: .1s !important; } .phone.p3 { animation-delay: .2s !important; }
  @keyframes shotIn { from { opacity: 0; translate: 0 40px; } }
  .has-shots .float.a { top: 7%; left: 4%; right: auto; }
  .has-shots .float.b { bottom: 9%; left: 6%; }

  /* 손님용 · 사장님용 두 묶음 (groups) */
  /* PC 전용 (desks): 브라우저 창 3개 겹치기 */
  .desks .desk { width: 46%; }
  .desks .desk.d1 { left: 3%; top: 9%; }
  .desks .desk.d3 { left: auto; right: 3%; top: 24%; }
  .desks .desk.d2 { left: 21%; top: 15%; width: 58%; z-index: 2; box-shadow: 0 40px 80px -30px rgba(20,20,50,.55); }
  .desks .desk.d2 { animation-delay: .1s !important; } .desks .desk.d3 { animation-delay: .2s !important; }
  .visual:hover .desks .desk.d1 { transform: translate(-14px, -6px); }
  .visual:hover .desks .desk.d2 { transform: translateY(-10px); }
  .visual:hover .desks .desk.d3 { transform: translate(14px, 6px); }
  .has-shots:has(.desks) .float { z-index: 5; }
  .has-shots:has(.desks) .float.a { top: 6%; right: 4%; left: auto; }
  .has-shots:has(.desks) .float.b { bottom: 7%; left: 4%; }

  /* 묶음 라벨: 위에 떠 있는 말풍선(.float)과 같은 모양 */
  .groups .glabel {
    position: absolute; top: 4%; z-index: 5; translate: -50% 0;
    padding: 8px 13px; border-radius: 12px; white-space: nowrap;
    font-size: 12px; font-weight: 600; color: var(--ink);
    background: color-mix(in srgb, var(--card) 88%, transparent);
    border: 1px solid var(--line); backdrop-filter: blur(10px);
    box-shadow: 0 14px 30px -14px rgba(0,0,0,.35);
  }
  .groups .glabel em { font-style: normal; color: var(--hue); }
  .groups .glabel.g1 { left: 25%; } .groups .glabel.g2 { left: 73.5%; }
  .groups .phone { height: 72%; top: 18%; }
  .groups .phone.p2 { height: 80%; top: 13%; }
  .groups .phone.g1.p1 { left: 4%; } .groups .phone.g1.p2 { left: 13.5%; } .groups .phone.g1.p3 { left: 26.5%; }
  .groups .phone.g2.p1 { left: 52.5%; } .groups .phone.g2.p2 { left: 62%; } .groups .phone.g2.p3 { left: 75%; }
  .groups .phone.g2.p1 { animation-delay: .25s !important; } .groups .phone.g2.p2 { animation-delay: .15s !important; } .groups .phone.g2.p3 { animation-delay: .35s !important; }
  .work-title { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 24px; }
  .work-title h3 { margin: 0; font-size: clamp(24px, 3vw, 32px); font-weight: 600; letter-spacing: -0.03em; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .work-title h3 .num { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--hue); letter-spacing: 0; }
  .work-title h3 .sub-t { color: var(--muted); font-weight: 400; }
  .links { display: flex; flex-wrap: wrap; gap: 20px; }
  .visit {
    display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; padding-bottom: 2px;
    background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
    transition: background-size 0.25s, color 0.2s;
  }
  .visit:hover { background-size: 100% 1px; }
  .work .visit:hover { color: var(--hue); }
  .visit svg { width: 15px; height: 15px; fill: currentColor; }
  .case { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
  .case > div { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .case .mono { display: flex; align-items: center; gap: 8px; }
  .case .mono::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--hue); box-shadow: 0 0 8px var(--hue); }
  .case p { margin: 0; color: var(--muted); font-size: 15px; }
  .case ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 15px; }
  .case ul li::before { content: "– "; }
  .facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; font-size: 15px; margin: 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; }

  /* 목업 (화면에 들어오면 한 번 살아 움직임) */
  .row { display: flex; gap: 3%; height: 100%; }
  .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .h { font-weight: 600; font-size: 1.15em; }
  .sub { color: #8a8a92; }
  .msg { padding: 7px 10px; border-radius: 10px; max-width: 88%; }
  .msg.me { align-self: flex-end; background: #1a1a1f; color: #fff; border-bottom-right-radius: 3px; }
  .msg.ai { background: #f2f2f4; border-bottom-left-radius: 3px; }
  .map { position: relative; border-radius: 8px; overflow: hidden; background: #eef3ee; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .route { animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -11; } }
  .stop { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0f0f2; }
  .stop b { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 0.85em; flex: none; }
  .cafe { padding: 8px 10px; border: 1px solid #ededf0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .seat-badge { font-weight: 600; padding: 2px 8px; border-radius: 999px; font-size: 0.9em; white-space: nowrap; }
  .seats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .seats i { aspect-ratio: 1; border-radius: 4px; background: #ececef; }
  .seats i.free { background: #e89a0c; animation: glow 2.2s ease-in-out infinite; }

  $("contactGh").href = DATA.github;
  $("foot").textContent = `© ${new Date().getFullYear()} ${DATA.name} · ${DATA.role}`;
  $("copy").addEventListener("click", () => {
    const btn = $("copy");
    const done = (t) => { btn.textContent = t; setTimeout(() => (btn.textContent = "이메일 복사"), 1800); };
    const sel = () => {
      const r = document.createRange();
      r.selectNodeContents($("email"));
      const s = getSelection();
      s.removeAllRanges();
      s.addRange(r);
      done("선택됨 · Ctrl+C");
    };
    try { navigator.clipboard.writeText(DATA.email).then(() => done("복사했어요 ✓"), sel); } catch (e) { sel(); }
  });

  /* ---------- 스크롤: 진행 바 · 헤더 선 · 메뉴 표시 ---------- */
  const hdr = $("hdr"), prog = $("progress");
  const onScroll = () => {
    const h = document.documentElement.scrollHeight - innerHeight;
    prog.style.transform = `scaleX(${h > 0 ? scrollY / h : 0})`;
    hdr.classList.toggle("line", scrollY > 8);
  };
  addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  const navs = [...document.querySelectorAll("header nav a[href^='#']")];
  const secIO = new IntersectionObserver(
    (es) => es.forEach((e) => { if (e.isIntersecting) navs.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }),
    { rootMargin: "-45% 0px -50% 0px" },
  );
  ["work", "about", "timeline", "contact"].forEach((id) => secIO.observe($(id)));

  /* ---------- 등장 애니메이션 + 목업/간트 재생 ---------- */
  const playIO = new IntersectionObserver(
    (es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); playIO.unobserve(e.target); } }),
    { threshold: 0.25 },
  );
  document.querySelectorAll(".work, .gantt").forEach((el) => playIO.observe(el));
  if (!reduce) {
    const rvIO = new IntersectionObserver(
      (es) => es.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.remove("wait"); e.target.classList.add("play"); rvIO.unobserve(e.target); }
      }),
      { threshold: 0.12 },
    );
    document.querySelectorAll(".rv").forEach((el) => {
      if (el.getBoundingClientRect().top > innerHeight) { el.classList.add("wait"); rvIO.observe(el); }
    });
  }

  /* ---------- 카드 3D 기울기 + 반사광, 자석 버튼 (마우스일 때만) ---------- */
  if (finePointer && !reduce) {
    document.querySelectorAll(".visual").forEach((card) => {
      card.addEventListener("pointermove", (e) => {
        const r = card.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
        card.style.setProperty("--ry", (px - 0.5) * 6 + "deg");
        card.style.setProperty("--rx", (0.5 - py) * 4 + "deg");
        card.style.setProperty("--gx", px * 100 + "%");
        card.style.setProperty("--gy", py * 100 + "%");
      });
      card.addEventListener("pointerleave", () => { card.style.setProperty("--rx", "0deg"); card.style.setProperty("--ry", "0deg"); });
    });
    document.querySelectorAll(".mag").forEach((b) => {
      b.addEventListener("pointermove", (e) => {
        const r = b.getBoundingClientRect();
        b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * 0.2}px, ${(e.clientY - r.top - r.height / 2) * 0.3}px)`;
      });
      b.addEventListener("pointerleave", () => (b.style.transform = ""));
    });
  }
</script>
